<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro | ONG Esperança Viva</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <header>
    <h1>ONG Esperança Viva</h1>
    <p>Transformando vidas por meio da educação e da solidariedade.</p>
    <nav aria-label="Menu principal">
      <ul>
        <li><a href="index.html">Início</a></li>
        <li><a href="projetos.html">Projetos</a></li>
        <li><a href="cadastro.html" aria-current="page">Seja voluntário</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section>
      <h2>Cadastro de voluntário</h2>
      <form action="#" method="post">
        <fieldset>
          <legend>Dados pessoais</legend>
          <label for="nome">Nome completo</label>
          <input type="text" id="nome" name="nome" autocomplete="name" required>
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
          <label for="telefone">Telefone</label>
          <input type="tel" id="telefone" name="telefone" pattern="\(\d{2}\) \d{4,5}-\d{4}" placeholder="(98) 99999-9999" maxlength="15" title="Formato: (00) 00000-0000" required>
          <label for="nascimento">Data de nascimento</label>
          <input type="date" id="nascimento" name="nascimento" required>
          <label for="cpf">CPF</label>
          <input type="text" id="cpf" name="cpf" pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" placeholder="000.000.000-00" maxlength="14" inputmode="numeric" title="Formato: 000.000.000-00" required>
        </fieldset>

        <fieldset>
          <legend>Endereço</legend>
          <label for="cep">CEP</label>
          <input type="text" id="cep" name="cep" pattern="\d{5}-\d{3}" placeholder="00000-000" maxlength="9" inputmode="numeric" title="Formato: 00000-000" required>
          <label for="endereco">Endereço</label>
          <input type="text" id="endereco" name="endereco" autocomplete="street-address" required>
          <label for="cidade">Cidade</label>
          <input type="text" id="cidade" name="cidade" required>
          <label for="estado">Estado</label>
          <select id="estado" name="estado" required>
            <option value="">Selecione</option>
            <option value="MA">Maranhão</option>
            <option value="PA">Pará</option>
            <option value="PI">Piauí</option>
            <option value="CE">Ceará</option>
            <option value="SP">São Paulo</option>
            <option value="RJ">Rio de Janeiro</option>
            <option value="OU">Outro</option>
          </select>
        </fieldset>

        <fieldset>
          <legend>Interesse no voluntariado</legend>
          <fieldset>
            <legend>Disponibilidade</legend>
            <label class="opcao"><input type="radio" name="turno" value="manha" required> Manhã</label>
            <label class="opcao"><input type="radio" name="turno" value="tarde"> Tarde</label>
            <label class="opcao"><input type="radio" name="turno" value="noite"> Noite</label>
          </fieldset>
          <fieldset>
            <legend>Áreas de interesse</legend>
            <label class="opcao"><input type="checkbox" name="area" value="reforco"> Reforço escolar</label>
            <label class="opcao"><input type="checkbox" name="area" value="arte"> Arte e cultura</label>
            <label class="opcao"><input type="checkbox" name="area" value="eventos"> Eventos</label>
          </fieldset>
          <label for="mensagem">Mensagem</label>
          <textarea id="mensagem" name="mensagem" rows="4" maxlength="500"></textarea>
          <label class="="opcao"><input type="checkbox" name="termos" value="aceito" required> Li e aceito os termos de uso dos dados</label>
        </fieldset>

        <button type="submit">Enviar cadastro</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 ONG Esperança Viva. Todos os direitos reservados.</p>
  </footer>
</body>
</html>
